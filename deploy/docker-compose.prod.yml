# PROMANGO — نشر إنتاجي على خادم واحد (VPS) عبر Docker Compose.
# التشغيل: انظر docs/deploy.md. كل الأسرار في deploy/.env (لا تُرفع إلى Git).
name: promango

services:
  db:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: promango
      POSTGRES_USER: ${POSTGRES_USER:-promango}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اضبط POSTGRES_PASSWORD في deploy/.env}
    # الخادم يرفض DATABASE_SSL=false في الإنتاج: نشغّل PostgreSQL بـ TLS بشهادة من scripts/gen-db-cert.sh.
    # المفتاح يُنسخ داخل الحاوية لأن PostgreSQL يشترط أن يملكه مستخدم postgres وبصلاحية 0600.
    command: >
      sh -c "install -o postgres -g postgres -m 0600 /certs/server.key /var/lib/postgresql/server.key &&
             install -o postgres -g postgres -m 0644 /certs/server.crt /var/lib/postgresql/server.crt &&
             exec docker-entrypoint.sh postgres -c ssl=on
             -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
             -c ssl_min_protocol_version=TLSv1.2"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets/db:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d promango"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../apps/api
    image: promango-api:${PROMANGO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: https://${PROMANGO_DOMAIN:?اضبط PROMANGO_DOMAIN}
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-promango}:${POSTGRES_PASSWORD}@db:5432/promango
      DATABASE_SSL: "true"
      DATABASE_SSL_CA: /certs/ca.crt
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      BILLING_ENCRYPTION_KEY: ${BILLING_ENCRYPTION_KEY:?}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - ./secrets/db/ca.crt:/certs/ca.crt:ro
    networks: [internal]

  web:
    build:
      context: ../apps/web
    image: promango-web:${PROMANGO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PROMANGO_DOMAIN: ${PROMANGO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?اضبط ACME_EMAIL لشهادة Let's Encrypt}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:

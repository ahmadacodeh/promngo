# اختبارات الطفرات على منطق B2 الحرج (52 طفرة): أبطأ من CI العادي، فتعمل أسبوعيًا وعند الطلب.
name: Mutation

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-b2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promango
          POSTGRES_PASSWORD: promango-ci
          POSTGRES_DB: promango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U promango" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: |
          for k in JWT_ACCESS_SECRET JWT_REFRESH_SECRET BILLING_ENCRYPTION_KEY; do
            v=$(openssl rand -hex 32); echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"
          done
          echo "DATABASE_URL=postgresql://promango:promango-ci@localhost:5432/promango_dev" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://promango:promango-ci@localhost:5432/promango_test" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run mutation:b2
